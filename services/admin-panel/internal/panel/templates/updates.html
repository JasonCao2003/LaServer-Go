<!doctype html><html lang="zh-CN"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>更新接收</title>{{template "theme"}}{{template "navigation"}}<main><a href="/">服务概览</a><h1>运营配置更新接收</h1><p>{{if .Address}}监听 {{.Address}}/updates{{else}}监听已停止{{end}}</p><form method="post"><input type="hidden" name="csrf" value="{{.CSRF}}">{{if .Address}}<button name="action" value="stop">停止接收</button>{{else}}<button name="action" value="start">启动接收</button>{{end}} <a href="/updates">刷新</a></form><p>{{.Last}}</p><h2>更新批次</h2>{{range .Batches}}<article><code>{{.ID}}</code> {{.Status}}{{if eq .Status "pending"}}<details><summary>查看配置</summary><pre>{{.Preview}}</pre></details><form method="post"><input type="hidden" name="csrf" value="{{$.CSRF}}"><input type="hidden" name="id" value="{{.ID}}"><button name="action" value="apply">确认应用</button> <button name="action" value="reject">拒绝批次</button></form>{{end}}</article>{{else}}尚无批次{{end}}</main></html>
