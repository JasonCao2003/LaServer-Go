<!doctype html><html lang="zh-CN"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>{{.Title}}</title>{{template "theme"}}{{template "navigation"}}<main><a href="/">服务概览</a><h1>{{.Title}}</h1><form><label>筛选最近 128 条记录 <input name="q" value="{{.Q}}"></label><button>刷新</button></form><table><tr><th>时间（UTC）</th><th>请求 / 接收</th><th>响应 / 发送</th></tr>{{range .Rows}}<tr><td>{{.Time.Format "2006-01-02 15:04:05.000"}}</td><td>{{.Request}}</td><td>{{.Response}}</td></tr>{{else}}<tr><td colspan="3">没有匹配的记录</td></tr>{{end}}</table></main></html>
